<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fearville</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #120d14; color: #eadfcf; font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    h1 { font-family: Georgia, serif; font-weight: 400; letter-spacing: .04em; margin: 0 0 8px; }
    p { color: #b7a99a; margin: 0 0 20px; }
    button { font: inherit; padding: 12px 28px; border-radius: 999px; border: 1px solid #8a6d4a; background: #2a1d24; color: inherit; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Fearville</h1>
    <p id="status">Lighting the lanterns…</p>
    <button id="retry" hidden>Retry</button>
  </main>
  <script>
    // Bundled start and offline page. Checks the site is reachable, then
    // hands the WebView over to it. Edit SITE for another environment.
    const SITE = 'https://staging.fearville.app/';
    const status = document.getElementById('status');
    const retry = document.getElementById('retry');
    async function open() {
      retry.hidden = true;
      status.textContent = 'Lighting the lanterns…';
      try {
        const controller = new AbortController();
        setTimeout(() => controller.abort(), 8000);
        await fetch(SITE, { method: 'HEAD', mode: 'no-cors', cache: 'no-store', signal: controller.signal });
        location.replace(SITE);
      } catch {
        status.textContent = 'Can’t reach Fearville. Check your connection.';
        retry.hidden = false;
      }
    }
    retry.addEventListener('click', open);
    window.addEventListener('online', open);
    open();
  </script>
</body>
</html>
