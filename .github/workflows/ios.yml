name: Native iOS build
on:
  workflow_dispatch:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
jobs:
  simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS simulator (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ios/Fearville.xcodeproj -scheme Fearville -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log || {
            # Surface compiler errors as annotations so they show on the run page.
            grep -E "error:" build.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
