name: Deploy
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
        required: true
      sha:
        description: 'Full tested main SHA; empty selects current main'
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  resolve:
    if: github.event_name == 'workflow_run' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
      - name: Validate tested main commit and promotion
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_CUTOVER_READY: ${{ vars.PRODUCTION_CUTOVER_READY }}
        run: node scripts/resolve-deploy.mjs
  deploy:
    needs: resolve
    if: needs.resolve.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ needs.resolve.outputs.environment }}
      url: ${{ needs.resolve.outputs.environment == 'staging' && 'https://staging.fearville.app' || 'https://fearville.app' }}
    concurrency:
      group: deploy-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOY_SHA: ${{ needs.resolve.outputs.sha }}
      DEPLOY_ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
      CLOUDFLARE_ENV: ${{ needs.resolve.outputs.environment }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci --no-audit --no-fund --loglevel=error
      - name: Resolve environment binding
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/configure-cloudflare.mjs "$DEPLOY_ENVIRONMENT"
      - name: Configure build identity
        run: node scripts/configure-deployment.mjs
      - name: Build selected environment
        run: npm run build
      - name: Upload browser source maps and create Sentry release
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_WEB_PROJECT || 'fearville-web' }}
        with:
          release: ${{ needs.resolve.outputs.sha }}
          environment: ${{ needs.resolve.outputs.environment }}
          sourcemaps: dist/client
          set_commits: skip
      - name: Upload Worker source maps
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_SERVER_PROJECT || 'fearville-server' }}
        with:
          release: ${{ needs.resolve.outputs.sha }}
          environment: ${{ needs.resolve.outputs.environment }}
          sourcemaps: dist/server
          set_commits: skip
      - name: Keep source maps private
        run: node scripts/remove-client-maps.mjs
      - name: Apply additive migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply DB --remote --env "$DEPLOY_ENVIRONMENT" --config wrangler.jsonc
      - name: Deploy Worker through CI
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --env "$DEPLOY_ENVIRONMENT"
      - name: Health and sandbox smoke
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/deploy-smoke.mjs
      - name: Deployment summary
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          {
            echo "### $DEPLOY_ENVIRONMENT deployment"
            echo "Commit: $DEPLOY_SHA"
            echo "Result: $RESULT"
            echo "Migrations: tracked additive D1 migrations applied before deploy."
            echo "Smoke: expected SHA/environment, D1, Durable Object, sandbox create/resume and multiplayer create/join."
          } >> "$GITHUB_STEP_SUMMARY"
